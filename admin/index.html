<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 躲猫猫 · 控制台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0d1117; --panel:#161b22; --card:#1c2128;
      --border:rgba(255,255,255,0.07);
      --accent:#7c6af7; --accent2:#f76a8c;
      --text:#e6edf3; --muted:rgba(230,237,243,0.48);
      --success:#3fb950; --danger:#f85149; --warn:#d29922;
    }
    html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }

    /* ── 布局 ── */
    .layout { display:grid; grid-template-columns:290px 1fr; grid-template-rows:50px 1fr; height:100vh; }

    /* ── 顶栏 ── */
    .topbar {
      grid-column:1/-1;
      background:var(--panel); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 1rem; gap:10px;
    }
    .topbar-logo { font-size:1.25rem; }
    .topbar-title { font-size:0.9rem; font-weight:700; }
    .live-pill {
      display:flex; align-items:center; gap:4px;
      font-size:0.68rem; color:var(--success);
      background:rgba(63,185,80,0.1);
      border:1px solid rgba(63,185,80,0.25);
      padding:2px 7px; border-radius:6px;
    }
    .live-dot { width:5px;height:5px;border-radius:50%;background:var(--success);animation:pulse 1.4s infinite; }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .topbar-gap { flex:1; }
    .topbar-timer { font-size:0.82rem;font-weight:600;color:var(--warn);background:rgba(210,153,34,.1);padding:3px 9px;border-radius:6px; }
    .tab-btn {
      padding:3px 12px; border-radius:6px; border:1px solid var(--border);
      background:transparent; color:var(--muted); font-size:0.75rem; cursor:pointer;
      font-family:inherit; transition:all .15s;
    }
    .tab-btn.active { background:rgba(124,106,247,.18); border-color:var(--accent); color:var(--text); }
    .tab-btn:hover:not(.active) { background:var(--card); }

    /* ── 侧栏 ── */
    .sidebar { background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

    .sb-section { padding:.75rem .9rem; border-bottom:1px solid var(--border); }
    .sb-label { font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.55rem; }

    /* 统计 */
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:7px; padding:.5rem; text-align:center; }
    .stat-n { font-size:1.35rem; font-weight:700; }
    .stat-l { font-size:.6rem; color:var(--muted); margin-top:1px; }
    .s-hider .stat-n{color:var(--accent);} .s-seeker .stat-n{color:var(--accent2);}

    /* 玩家列表 */
    .player-list { flex:1; overflow-y:auto; padding:.4rem .7rem; }
    .player-list::-webkit-scrollbar{width:3px;}
    .player-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

    .pi {
      display:flex; align-items:center; gap:8px;
      padding:.5rem .6rem; border-radius:7px; margin-bottom:2px;
      cursor:pointer; border:1px solid transparent; transition:background .15s;
    }
    .pi:hover{background:var(--card);}
    .pi.focused{background:var(--card);border-color:var(--accent);}
    .pi.offline{opacity:.3;}
    .pi-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;}
    .pi-ico.hider{background:rgba(124,106,247,.2);}
    .pi-ico.seeker{background:rgba(247,106,140,.2);}
    .pi-info{flex:1;min-width:0;}
    .pi-name{font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .pi-role{font-size:.66rem;color:var(--muted);margin-top:1px;}
    .pi-meta{text-align:right;flex-shrink:0;}
    .pi-status{font-size:.65rem;margin-bottom:1px;}
    .pi-time{font-size:.6rem;color:var(--muted);}
    .on-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--success);margin-right:2px;vertical-align:middle;}
    .off-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--danger);margin-right:2px;vertical-align:middle;}

    .empty{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.78rem;}
    .empty-ico{font-size:1.8rem;margin-bottom:.4rem;}

    /* 控制按钮 */
    .ctrl-area{padding:.75rem .9rem;border-top:1px solid var(--border);display:grid;gap:5px;}
    .btn{
      width:100%;padding:.55rem .9rem;border-radius:7px;
      border:1px solid var(--border);background:var(--card);color:var(--text);
      font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit;
      display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;
    }
    .btn:hover{background:rgba(124,106,247,.12);border-color:var(--accent);}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;}
    .btn.primary:hover{opacity:.88;}
    .btn.danger:hover{background:rgba(248,81,73,.12);border-color:var(--danger);color:var(--danger);}

    /* ── 地图 ── */
    #map{height:100%;}
    .leaflet-tile-pane{filter:brightness(.72) saturate(.75);}
    .leaflet-control-attribution{background:rgba(13,17,23,.8)!important;color:var(--muted)!important;font-size:10px!important;}
    .leaflet-bar a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}

    /* ── 历史面板（覆盖在地图上） ── */
    #history-panel{
      display:none; position:absolute; inset:0; z-index:500;
      background:var(--bg); overflow-y:auto; padding:1rem;
    }
    #history-panel.show{display:block;}
    .hist-header{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
    .hist-title{font-size:.95rem;font-weight:700;flex:1;}
    .hist-close{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:4px 10px;color:var(--text);font-size:.75rem;cursor:pointer;font-family:inherit;}

    /* 按玩家分组 */
    .hist-group{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:.75rem;overflow:hidden;}
    .hist-group-head{
      display:flex;align-items:center;gap:8px;
      padding:.65rem .9rem;cursor:pointer;
      border-bottom:1px solid var(--border);
      user-select:none;
    }
    .hist-group-head:hover{background:rgba(255,255,255,.03);}
    .hist-group-name{font-size:.85rem;font-weight:600;flex:1;}
    .hist-group-count{font-size:.68rem;color:var(--muted);}
    .hist-chevron{font-size:.7rem;color:var(--muted);transition:transform .2s;}
    .hist-group.open .hist-chevron{transform:rotate(90deg);}

    .hist-rows{display:none;}
    .hist-group.open .hist-rows{display:block;}

    .hist-row{
      display:grid;grid-template-columns:90px 1fr 70px;
      align-items:center;gap:8px;
      padding:.45rem .9rem;border-bottom:1px solid rgba(255,255,255,.04);
      font-size:.72rem;
    }
    .hist-row:last-child{border-bottom:none;}
    .hist-time{color:var(--muted);}
    .hist-coord{font-family:monospace;font-size:.68rem;color:var(--accent);}
    .hist-acc{color:var(--muted);text-align:right;}

    /* ── 吐司 ── */
    #toast{
      position:fixed;bottom:1.25rem;left:50%;
      transform:translateX(-50%) translateY(70px);
      background:var(--card);border:1px solid var(--border);
      border-radius:9px;padding:.55rem 1rem;
      font-size:.8rem;z-index:9999;
      transition:transform .28s;pointer-events:none;
    }
    #toast.show{transform:translateX(-50%) translateY(0);}

    /* ── 邀请链接显示 ── */
    .invite-bar{
      font-size:.68rem;color:var(--accent);
      background:rgba(124,106,247,.08);
      border:1px solid rgba(124,106,247,.2);
      border-radius:7px;padding:.45rem .7rem;
      cursor:pointer;word-break:break-all;
      transition:background .15s;
    }
    .invite-bar:hover{background:rgba(124,106,247,.15);}

    /* map container relative for overlay */
    .map-wrap{position:relative;overflow:hidden;}
    /* ══════════════════════════════════════
       移动端适配 (max-width: 768px)
       布局：地图全屏 + 顶部栏 + 底部抽屉
    ══════════════════════════════════════ */
    @media (max-width: 768px) {
      html,body { overflow:hidden; height:100%; }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 48px 1fr;
        height: 100vh;
      }

      .topbar { padding:0 .75rem; gap:6px; }
      .topbar-title { font-size:.78rem; }
      .topbar-timer { padding:2px 7px; font-size:.72rem; }
      .tab-btn { padding:2px 8px; font-size:.66rem; }

      /* 隐藏桌面侧栏 */
      .sidebar { display:none !important; }

      .map-wrap { position:relative; height:100%; overflow:hidden; }
      #map { height:100%; }

      /* ── 底部抽屉 ── */
      #mobile-drawer {
        display:flex; flex-direction:column;
        position:absolute; bottom:0; left:0; right:0; z-index:600;
        background:var(--panel);
        border-radius:18px 18px 0 0;
        border-top:1px solid var(--border);
        box-shadow:0 -8px 32px rgba(0,0,0,.5);
        transition:transform .32s cubic-bezier(.4,0,.2,1);
        max-height:72vh;
      }

      #mobile-drawer.collapsed { transform:translateY(calc(100% - 94px)); }

      .drawer-handle {
        display:flex; justify-content:center;
        padding:10px 0 6px; cursor:pointer; flex-shrink:0;
      }
      .drawer-handle::before {
        content:''; width:36px; height:4px;
        background:rgba(255,255,255,.18); border-radius:2px;
      }

      /* 统计行（收起时也可见）*/
      .drawer-stats-row {
        display:flex; align-items:center; gap:8px;
        padding:0 1rem .7rem; flex-shrink:0;
      }
      .m-stat {
        display:flex; align-items:center; gap:5px;
        background:var(--card); border:1px solid var(--border);
        border-radius:8px; padding:4px 10px; font-size:.72rem;
      }
      .m-stat-n { font-weight:700; font-size:.92rem; }
      .m-stat.h .m-stat-n { color:var(--accent); }
      .m-stat.s .m-stat-n { color:var(--accent2); }
      .m-stat-spacer { flex:1; }

      /* 操作按钮行 */
      .drawer-btn-row {
        display:flex; gap:5px;
        padding:0 .85rem .75rem; flex-shrink:0;
      }
      .m-btn {
        flex:1; padding:.52rem .4rem;
        border-radius:9px; border:1px solid var(--border);
        background:var(--card); color:var(--text);
        font-size:.66rem; font-weight:600; cursor:pointer;
        font-family:inherit;
        display:flex; align-items:center; justify-content:center; gap:3px;
        white-space:nowrap; transition:all .15s;
      }
      .m-btn:active { transform:scale(.93); }
      .m-btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; }
      .m-btn.danger:active { background:rgba(248,81,73,.15); color:var(--danger); }

      /* 玩家列表 */
      .drawer-list {
        flex:1; overflow-y:auto;
        padding:.5rem .75rem 1.5rem;
        border-top:1px solid var(--border);
      }
      .drawer-list::-webkit-scrollbar { width:3px; }
      .drawer-list::-webkit-scrollbar-thumb { background:var(--border); }

      .m-pi {
        display:flex; align-items:center; gap:10px;
        padding:.6rem .4rem;
        border-bottom:1px solid rgba(255,255,255,.04);
        cursor:pointer;
      }
      .m-pi:last-child { border-bottom:none; }
      .m-pi-ico { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0; }
      .m-pi-ico.hider  { background:rgba(124,106,247,.2); }
      .m-pi-ico.seeker { background:rgba(247,106,140,.2); }
      .m-pi-name { font-size:.83rem;font-weight:600; }
      .m-pi-sub  { font-size:.63rem;color:var(--muted);margin-top:1px; }
      .m-pi-right { margin-left:auto;text-align:right;flex-shrink:0; }
      .m-pi-acc  { font-size:.63rem;color:var(--muted); }
      .m-pi-ago  { font-size:.58rem;color:var(--muted); }
    }

    @media (min-width:769px) {
      #mobile-drawer { display:none !important; }
    }

    /* ── 密码锁屏 ── */
    #pwd-overlay {
      position:fixed; inset:0; z-index:99999;
      background:var(--bg);
      display:flex; align-items:center; justify-content:center;
    }
    #pwd-overlay.hidden { display:none; }

    .pwd-box {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:20px;
      padding:2.5rem 2rem;
      width:320px; max-width:90vw;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .pwd-logo { font-size:3rem; margin-bottom:.75rem; }
    .pwd-title { font-size:1.05rem; font-weight:700; margin-bottom:.3rem; }
    .pwd-sub { font-size:.78rem; color:var(--muted); margin-bottom:1.5rem; }

    .pwd-dots {
      display:flex; justify-content:center; gap:12px;
      margin-bottom:1.5rem;
    }
    .pwd-dot {
      width:14px; height:14px; border-radius:50%;
      border:2px solid var(--border);
      background:transparent;
      transition:all .2s;
    }
    .pwd-dot.filled { background:var(--accent); border-color:var(--accent); }
    .pwd-dot.error  { background:var(--danger); border-color:var(--danger); animation:shake .3s ease; }

    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      25%{ transform:translateX(-4px); }
      75%{ transform:translateX(4px); }
    }

    .pwd-keypad {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .pwd-key {
      padding:.9rem;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      font-size:1.1rem; font-weight:600;
      cursor:pointer; font-family:inherit;
      transition:all .15s;
      user-select:none;
    }
    .pwd-key:active { transform:scale(.9); background:rgba(124,106,247,.2); border-color:var(--accent); }
    .pwd-key.del { font-size:.85rem; color:var(--muted); }
    .pwd-key.zero { grid-column:2; }

    .pwd-error-msg {
      font-size:.75rem; color:var(--danger);
      margin-top:1rem; min-height:1.2em;
    }

    /* ── 轨迹回放面板 ── */
    #replay-panel {
      display:none; position:absolute; inset:0; z-index:501;
      flex-direction:column; background:transparent; pointer-events:none;
    }
    #replay-panel.show { display:flex; }

    /* 回放控制条（底部固定）*/
    .replay-bar {
      position:absolute; bottom:0; left:0; right:0;
      background:var(--panel);
      border-top:1px solid var(--border);
      border-radius:14px 14px 0 0;
      padding:.85rem 1rem;
      pointer-events:all;
      box-shadow:0 -4px 20px rgba(0,0,0,.4);
    }

    .replay-header {
      display:flex; align-items:center; gap:8px;
      margin-bottom:.65rem;
    }
    .replay-title { font-size:.85rem; font-weight:700; flex:1; }
    .replay-player-name {
      font-size:.75rem; color:var(--accent);
      background:rgba(124,106,247,.12);
      padding:2px 10px; border-radius:6px;
    }
    .replay-close {
      background:var(--card); border:1px solid var(--border);
      border-radius:7px; padding:3px 10px;
      color:var(--text); font-size:.72rem; cursor:pointer;
      font-family:inherit;
    }

    /* 进度条 */
    .replay-progress-wrap {
      position:relative; height:6px;
      background:var(--border); border-radius:3px;
      margin-bottom:.65rem; cursor:pointer;
    }
    .replay-progress-fill {
      height:100%; border-radius:3px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      transition:width .1s;
      pointer-events:none;
    }
    .replay-progress-thumb {
      position:absolute; top:50%; transform:translate(-50%,-50%);
      width:14px; height:14px; border-radius:50%;
      background:white; box-shadow:0 1px 4px rgba(0,0,0,.4);
      pointer-events:none;
    }

    /* 控制按钮行 */
    .replay-controls {
      display:flex; align-items:center; gap:8px;
    }
    .replay-btn {
      background:var(--card); border:1px solid var(--border);
      border-radius:8px; padding:.4rem .75rem;
      color:var(--text); font-size:.78rem; cursor:pointer;
      font-family:inherit; transition:all .15s;
    }
    .replay-btn:hover { background:rgba(124,106,247,.15); border-color:var(--accent); }
    .replay-btn.active { background:rgba(124,106,247,.2); border-color:var(--accent); color:var(--accent); }

    .replay-time {
      font-size:.75rem; color:var(--muted);
      font-family:monospace; margin-left:auto;
    }

    .replay-speed {
      background:var(--card); border:1px solid var(--border);
      border-radius:8px; padding:.4rem .6rem;
      color:var(--text); font-size:.72rem; cursor:pointer;
      font-family:inherit;
    }

    /* 轨迹点信息浮窗 */
    .replay-step-info {
      position:absolute; top:12px; left:12px;
      background:rgba(22,27,34,.92);
      border:1px solid var(--border);
      border-radius:10px; padding:.6rem .85rem;
      font-size:.75rem; pointer-events:none;
      z-index:10;
    }
    .replay-step-info b { color:var(--accent); }

    /* 历史面板增加回放按钮 */
    .replay-launch-btn {
      background:rgba(124,106,247,.15);
      border:1px solid rgba(124,106,247,.3);
      border-radius:7px; padding:3px 10px;
      color:var(--accent); font-size:.7rem;
      cursor:pointer; font-family:inherit;
      transition:all .15s; white-space:nowrap;
    }
    .replay-launch-btn:hover { background:rgba(124,106,247,.3); }

  </style>
</head>
<body>

<!-- ── 密码锁屏 ── -->
<div id="pwd-overlay">
  <div class="pwd-box">
    <div class="pwd-logo">🔐</div>
    <div class="pwd-title">控制台访问验证</div>
    <div class="pwd-sub">请输入 4 位访问密码</div>

    <div class="pwd-dots">
      <div class="pwd-dot" id="pd0"></div>
      <div class="pwd-dot" id="pd1"></div>
      <div class="pwd-dot" id="pd2"></div>
      <div class="pwd-dot" id="pd3"></div>
    </div>

    <div class="pwd-keypad">
      <button class="pwd-key" onclick="pwdInput('1')">1</button>
      <button class="pwd-key" onclick="pwdInput('2')">2</button>
      <button class="pwd-key" onclick="pwdInput('3')">3</button>
      <button class="pwd-key" onclick="pwdInput('4')">4</button>
      <button class="pwd-key" onclick="pwdInput('5')">5</button>
      <button class="pwd-key" onclick="pwdInput('6')">6</button>
      <button class="pwd-key" onclick="pwdInput('7')">7</button>
      <button class="pwd-key" onclick="pwdInput('8')">8</button>
      <button class="pwd-key" onclick="pwdInput('9')">9</button>
      <button class="pwd-key del" onclick="pwdDel()">⌫</button>
      <button class="pwd-key zero" onclick="pwdInput('0')">0</button>
    </div>

    <div class="pwd-error-msg" id="pwd-err"></div>
  </div>
</div>

<div class="layout">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="topbar-logo">🙈</div>
    <div class="topbar-title">躲猫猫控制台</div>
    <div class="live-pill"><div class="live-dot"></div>实时</div>
    <div class="topbar-gap"></div>
    <button class="tab-btn active" id="tab-map" onclick="switchTab('map')">地图</button>
    <button class="tab-btn" id="tab-hist" onclick="switchTab('hist')">历史记录</button>
    <div class="topbar-timer" id="timer">00:00</div>
  </div>

  <!-- 侧栏 -->
  <div class="sidebar">
    <!-- 统计 -->
    <div class="sb-section">
      <div class="sb-label">实时统计</div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">全部</div></div>
        <div class="stat s-hider"><div class="stat-n" id="s-hider">0</div><div class="stat-l">躲藏者</div></div>
        <div class="stat s-seeker"><div class="stat-n" id="s-seeker">0</div><div class="stat-l">寻找者</div></div>
      </div>
    </div>

    <!-- 邀请链接 -->
    <div class="sb-section">
      <div class="sb-label">邀请链接</div>
      <div class="invite-bar" id="invite-bar" onclick="copyLink()">点击复制邀请链接</div>
    </div>

    <!-- 玩家列表 -->
    <div class="sb-section" style="padding-bottom:.4rem;">
      <div class="sb-label">玩家列表</div>
    </div>
    <div class="player-list" id="player-list">

function makeIcon(role) {

    iconSize:[36,36], iconAnchor:[18,36], popupAnchor:[0,-40], className:''
  });
}

function popupHtml(p, addr) {
  const r = ROLE[p.role] || ROLE.hider;

  const addrLine = addr

  return `<div style="font-family:system-ui;min-width:170px;font-size:13px;max-width:220px;">
    <b style="font-size:14px;">${r.icon} ${p.nickname}</b><br>

    <span style="color:#888;font-size:11px;">精度：±${p.accuracy}m · ${ago}s前</span><br>
    <div style="margin-top:4px;font-size:10px;color:#999;font-family:monospace;

    ${addrLine}

}

// 反查详细地址（Nominatim，zoom=18 获取街道级）
const addrCache = {};
async function fetchAddr(pid, lat, lng) {
  if (addrCache[pid]) return addrCache[pid];
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=zh-CN&zoom=18`,
      { headers:{'Accept-Language':'zh-CN'}, signal:ctrl.signal }
    );
    const d = await r.json();
    const a = d.address || {};
    // 拼完整地址：省/市/区/街道/门牌
    const parts = [
      (a.province||a.state||'').replace(/省$|自治区$/,''),
      (a.city||'').replace(/市$/,''),
      (a.district||a.county||'').replace(/区$|县$/,''),
      a.suburb || a.neighbourhood || '',
      a.road || a.pedestrian || '',
      a.house_number || ''
    ].filter(s => s && s.trim());
    // 去重（直辖市省=市）
    const unique = parts.filter((s,i) => parts.indexOf(s) === i);
    const addr = unique.join('') || d.display_name?.split(',').slice(0,4).join('') || '';
    addrCache[pid] = addr;
    return addr;
  } catch { return ''; }
}

// ── 更新玩家 ─────────────────────────────────────
function upsertPlayer(p) {
  players[p.id] = p;
  if (markers[p.id]) {
    markers[p.id].setLatLng([p.lat, p.lng]);
    markers[p.id].getPopup().setContent(popupHtml(p, addrCache[p.id] || null));
    // 更新图标（角色可能变化）
    markers[p.id].setIcon(makeIcon(p.role));
  } else {
    markers[p.id] = L.marker([p.lat, p.lng], { icon: makeIcon(p.role) })
      .addTo(map).bindPopup(popupHtml(p, null));
  }
  if (focused === p.id) map.panTo([p.lat, p.lng]);
  renderList(); updateStats(); tryAutoFit();
}

function removeMarker(id) {
  if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
  delete players[id];
  renderList(); updateStats();
}

// ── 实时订阅 ─────────────────────────────────────
function startRealtime() {
  // 先拉一次全量
  db.from('players').select('*').eq('online', true).then(({ data }) => {
    (data || []).forEach(upsertPlayer);
  });

  // 实时推送
  db.channel('players-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'players' }, payload => {
      const { eventType, new: n, old: o } = payload;
      if (eventType === 'DELETE') { removeMarker(o.id); return; }
      if (n.online === false) {
        // 离线：移除标记、从列表移除
        removeMarker(n.id); return;
      }
      upsertPlayer(n);
    })
    .subscribe(status => {
      console.log('Realtime:', status);
    });
}

// ── 标签页切换 ───────────────────────────────────
function switchTab(t) {

// ── 历史记录 ─────────────────────────────────────
async function loadHistory() {
  const el = document.getElementById('hist-content');
  el.innerHTML = '<div class="empty"><div class="empty-ico">⏳</div><div>加载中...</div></div>';

  const { data, error } = await db
    .from('location_history')
    .select('*')
    .order('recorded_at', { ascending: false })
    .limit(2000);

  if (error || !data) {
    el.innerHTML = '<div class="empty">加载失败，请检查数据库连接</div>';
    return;
  }
  if (data.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">📭</div><div>暂无历史记录</div></div>';
    return;
  }

  // 按 player_id 分组，同时存入全局 histGroups 供回放使用
  const groups = {};
  histGroups = {};
  data.forEach(row => {
    if (!groups[row.player_id]) {
      groups[row.player_id] = { nickname: row.nickname, rows: [] };
      histGroups[row.player_id] = groups[row.player_id];
    }
    groups[row.player_id].rows.push(row);
  });

  el.innerHTML = Object.entries(groups).map(([pid, g]) => `
    <div class="hist-group" id="hg-${CSS.escape(pid)}">
      <div class="hist-group-head" onclick="toggleGroup('${pid}')">
        <span>🙈</span>
        <span class="hist-group-name">${g.nickname}</span>
        <span class="hist-group-count">${g.rows.length} 条记录</span>
        <button class="replay-launch-btn" onclick="event.stopPropagation();startReplay('${pid}')">🎬 回放</button>
        <span class="hist-chevron">▶</span>
      </div>
      <div class="hist-rows">
        <div class="hist-row" style="font-size:.65rem;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06);">
          <span>时间</span><span>经纬度</span><span style="text-align:right;">精度</span>
        </div>
        ${g.rows.map(r => {
          const t = new Date(r.recorded_at);
          const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
          return `<div class="hist-row">
            <span class="hist-time">${ts}</span>
            <span class="hist-coord">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</span>
            <span class="hist-acc">±${r.accuracy}m</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function toggleGroup(pid) {
  const el = document.getElementById('hg-' + CSS.escape(pid));
  el.classList.toggle('open');
}

// ── 轨迹回放 ─────────────────────────────────────────
let replayData      = [];   // 当前回放的坐标点数组
let replayIdx       = 0;    // 当前帧索引
let replayTimer     = null; // 播放定时器
let replayMarker    = null; // 回放专用标记
let replayPolyline  = null; // 轨迹线
let replayExtraLayers = []; // 起/终点标记等额外图层
let replayPlaying   = false;
let replayNickname  = '';   // 当前回放玩家昵称
let histGroups      = {};   // 缓存历史分组数据（由 loadHistory 填充）

// 从历史记录发起回放
async function startReplay(pid) {
  // 切换到地图视图
  switchTab('map');

  const g = histGroups[pid];
  if (!g || !g.rows.length) {
    toast('该玩家暂无历史记录');
    return;
  }

  // 按时间升序排列
  replayData = [...g.rows].sort((a,b) => new Date(a.recorded_at) - new Date(b.recorded_at));
  replayNickname = g.nickname;
  replayIdx  = 0;
  replayPlaying = false;

  // 显示回放面板
  document.getElementById('replay-panel').classList.add('show');
  document.getElementById('replay-pname').textContent = g.nickname;
  document.getElementById('replay-info').style.display = 'block';
  document.getElementById('replay-play-btn').textContent = '▶ 播放';

  // 清除旧轨迹
  cleanReplayLayers();

  // 画轨迹线（所有点）
  const latlngs = replayData.map(r => [r.lat, r.lng]);
  replayPolyline = L.polyline(latlngs, {
    color: '#7c6af7', weight: 3, opacity: 0.7,
    dashArray: '6,4'
  }).addTo(map);

  // 起点标记
  const startMark = L.circleMarker(latlngs[0], { radius:7, color:'#4ade80', fillColor:'#4ade80', fillOpacity:1, weight:2 })
    .addTo(map).bindTooltip('起点');
  replayExtraLayers.push(startMark);

  // 终点标记
  if (latlngs.length > 1) {
    const endMark = L.circleMarker(latlngs[latlngs.length-1], { radius:7, color:'#f85149', fillColor:'#f85149', fillOpacity:1, weight:2 })
      .addTo(map).bindTooltip('终点');
    replayExtraLayers.push(endMark);
  }

  // 飞到轨迹范围
  map.flyToBounds(replayPolyline.getBounds(), { padding:[60,100], duration:1 });

  // 渲染第0帧
  renderReplayFrame();
}

function renderReplayFrame() {
  const total = replayData.length;
  if (!total) return;
  const row = replayData[replayIdx];
  const latlng = [row.lat, row.lng];

  // 移动/创建回放标记
  if (replayMarker) {
    replayMarker.setLatLng(latlng);
  } else {
    replayMarker = L.marker(latlng, {
      icon: L.divIcon({
        html:`<div style="width:30px;height:30px;border-radius:50%;
          background:linear-gradient(135deg,#7c6af7,#f76a8c);
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 2px 10px rgba(124,106,247,.6);
          border:2px solid white;font-size:14px;">🙈</div>`,
        iconSize:[30,30], iconAnchor:[15,15], className:''
      })
    }).addTo(map);
  }

  // 更新进度条
  const pct = total > 1 ? (replayIdx / (total-1)) * 100 : 100;
  document.getElementById('replay-prog-fill').style.width  = pct + '%';
  document.getElementById('replay-prog-thumb').style.left  = pct + '%';
  document.getElementById('replay-time-label').textContent = `${replayIdx+1} / ${total}`;

  // 更新信息浮窗
  const t = new Date(row.recorded_at);
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
  document.getElementById('ri-name').textContent  = replayNickname || '玩家';
  document.getElementById('ri-time').textContent  = ts;
  document.getElementById('ri-coord').textContent = `${row.lat.toFixed(6)}, ${row.lng.toFixed(6)}`;
  document.getElementById('ri-acc').textContent   = `精度 ±${row.accuracy}m`;
}

function toggleReplay() {
  if (replayPlaying) {
    pauseReplay();
  } else {
    playReplay();
  }
}

function playReplay() {
  if (replayIdx >= replayData.length - 1) replayIdx = 0; // 从头播
  replayPlaying = true;
  document.getElementById('replay-play-btn').textContent = '⏸ 暂停';
  const speed = Number(document.getElementById('replay-speed').value);
  replayTimer = setInterval(() => {
    replayIdx++;
    renderReplayFrame();
    if (replayIdx >= replayData.length - 1) {
      pauseReplay();
    }
  }, speed);
}

function pauseReplay() {
  replayPlaying = false;
  clearInterval(replayTimer);
  document.getElementById('replay-play-btn').textContent = '▶ 播放';
}

function replayStep(dir) {
  pauseReplay();
  replayIdx = Math.max(0, Math.min(replayData.length-1, replayIdx + dir));
  renderReplayFrame();
}

function replaySeek(e) {
  const wrap = document.getElementById('replay-prog-wrap');
  const rect  = wrap.getBoundingClientRect();
  const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  replayIdx   = Math.round(pct * (replayData.length - 1));
  pauseReplay();
  renderReplayFrame();
}

function updateReplaySpeed() {
  if (replayPlaying) { pauseReplay(); playReplay(); }
}

function closeReplay() {
  pauseReplay();
  cleanReplayLayers();
  document.getElementById('replay-panel').classList.remove('show');
  document.getElementById('replay-info').style.display = 'none';
}

function cleanReplayLayers() {
  if (replayMarker)     { map.removeLayer(replayMarker);     replayMarker = null; }
  if (replayPolyline)   { map.removeLayer(replayPolyline);   replayPolyline = null; }
  replayExtraLayers.forEach(l => map.removeLayer(l));
  replayExtraLayers = [];
}




// ── 移动端抽屉 ────────────────────────────────────
let drawerOpen = false;
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  const d = document.getElementById('mobile-drawer');
  if (d) d.classList.toggle('collapsed', !drawerOpen);
}

function renderMobileList() {
  const el = document.getElementById('mobile-player-list');
  if (!el) return;
  const pids = Object.keys(players);
  if (pids.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">⏳</div><div>等待玩家加入...</div></div>';
    return;
  }
  el.innerHTML = pids.map(id => {
    const p = players[id];
    const r = ROLE[p.role] || ROLE.hider;
    const ago = p.updated_at ? Math.round((Date.now() - new Date(p.updated_at)) / 1000) : '?';
    return `<div class="m-pi" onclick="focusPlayer('${id}');if(!drawerOpen)toggleDrawer();">
      <div class="m-pi-ico ${p.role||'hider'}">${r.icon}</div>
      <div>
        <div class="m-pi-name">${p.nickname}</div>
        <div class="m-pi-sub" style="color:${r.color}">${r.label}</div>
      </div>
      <div class="m-pi-right">
        <div class="m-pi-acc">±${p.accuracy}m</div>
        <div class="m-pi-ago">${ago}s前</div>
      </div>
    </div>`;
  }).join('');
}

// ── 吐司 ─────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── 初始化 ───────────────────────────────────────

// ── 密码验证 ──────────────────────────────────────
const ADMIN_PWD = '1234'; // ← 修改这里改密码
const PWD_STORAGE_KEY = 'hsg_admin_auth';
const PWD_EXPIRE = 8 * 3600 * 1000; // 8小时内免重新输入

let pwdBuffer = '';

function pwdInit() {
  // 检查是否在有效期内已验证过
  const saved = localStorage.getItem(PWD_STORAGE_KEY);
  const savedTs = Number(localStorage.getItem(PWD_STORAGE_KEY + '_ts') || 0);
  if (saved === 'ok' && Date.now() - savedTs < PWD_EXPIRE) {
    document.getElementById('pwd-overlay').classList.add('hidden');
    return;
  }
  // 否则显示锁屏
  document.getElementById('pwd-overlay').classList.remove('hidden');
}

function pwdInput(digit) {
  if (pwdBuffer.length >= 4) return;
  pwdBuffer += digit;
  updateDots();
  if (pwdBuffer.length === 4) {
    setTimeout(checkPwd, 120); // 短暂延迟让最后一个点亮起来
  }
}

function pwdDel() {
  if (!pwdBuffer.length) return;
  pwdBuffer = pwdBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pwd-err').textContent = '';
}

function updateDots(state) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('pd' + i);
    d.className = 'pwd-dot';
    if (state === 'error') d.classList.add('error');
    else if (i < pwdBuffer.length) d.classList.add('filled');
  }
}

function checkPwd() {
  if (pwdBuffer === ADMIN_PWD) {
    // 验证成功
    localStorage.setItem(PWD_STORAGE_KEY, 'ok');
    localStorage.setItem(PWD_STORAGE_KEY + '_ts', String(Date.now()));
    document.getElementById('pwd-overlay').classList.add('hidden');
  } else {
    // 验证失败
    updateDots('error');
    document.getElementById('pwd-err').textContent = '密码错误，请重试';
    setTimeout(() => {
      pwdBuffer = '';
      updateDots();
      document.getElementById('pwd-err').textContent = '';
    }, 800);
  }
}

// 支持键盘输入
document.addEventListener('keydown', e => {
  if (document.getElementById('pwd-overlay').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pwdInput(e.key);
  if (e.key === 'Backspace') pwdDel();
});

window.addEventListener('DOMContentLoaded', () => {
  pwdInit();
  initMap();
  startRealtime();
});
</script>
